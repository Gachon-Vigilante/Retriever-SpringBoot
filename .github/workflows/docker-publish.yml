name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: clean bootJar

      - name: Log in to OCIR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_PASSWORD }}

      - name: Set Docker image tags
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-7)
          BUILD_VERSION=${{ github.run_number }}-${SHORT_SHA}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "BASE_TAG=latest" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "BASE_TAG=dev" >> $GITHUB_ENV
          else
            echo "BASE_TAG=dev" >> $GITHUB_ENV
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

      - name: Build and push ARM64 Docker image
        run: |
          docker buildx build --platform linux/arm64 \
            -t ${{ secrets.REGISTRY_PREFIX }}/retriever-springboot:${{ env.BASE_TAG }} \
            -t ${{ secrets.REGISTRY_PREFIX }}/retriever-springboot:${{ env.BUILD_VERSION }} \
            --push .

      - name: Update infra repo deployment (production/springboot/deployment.yaml)
        env:
          NEW_IMAGE: ${{ secrets.REGISTRY_PREFIX }}/retriever-springboot:${{ env.BUILD_VERSION }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
        run: |
          sudo apt-get update && sudo apt-get install -y yq
          git clone --single-branch --branch main https://x-access-token:${{ secrets.K8S_REPO_TOKEN }}@github.com/Gachon-Vigilante/Retriever-INFRA.git
          DEPLOY_FILE=Retriever-INFRA/production/springboot/deployment.yaml
          if [[ -f "$DEPLOY_FILE" ]]; then
            yq -i -y ".spec.template.spec.containers[0].image = \"$NEW_IMAGE\"" "$DEPLOY_FILE"
            cd Retriever-INFRA
            git config user.name ${{ secrets.GIT_USER_NAME }}
            git config user.email ${{ secrets.GIT_USER_EMAIL }}
            if [[ -n "$(git status --porcelain)" ]]; then
              git add .
              git commit -m "Chore: Spring Boot 이미지 업데이트 - ${BUILD_VERSION} (from ${GITHUB_REPOSITORY}:${GITHUB_REF##*/})"
              git push https://x-access-token:${{ secrets.K8S_REPO_TOKEN }}@github.com/Gachon-Vigilante/Retriever-INFRA.git
            else
              echo "No changes to deployment file."
            fi
          else
            echo "Deployment file not found. Skipping update."
            exit 0
          fi
